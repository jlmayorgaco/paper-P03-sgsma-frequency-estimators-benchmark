run:
  id: phase1-integration
  mode: matrix
  output_dir: ../artifacts/openfreqbench
  n_runs: 3
  base_seed: 20260608
  max_workers: 1
  capture_signals: false

benchmark:
  parameter_policy: default
  scenarios:
    - IEEE_Single_SinWave
    - IEEE_Freq_Step
    - IEEE_Mag_Step_5pct
    - IEEE_Phase_Jump_20
  estimators:
    - name: ZCD
    - name: IPDFT
    - name: TFT
    - name: PLL
    - name: SOGI-PLL
    - name: EKF
    - name: UKF
    - name: RA-EKF

metrics:
  profile: canonical-single-phase-v1
  include:
    - m1_rmse_hz
    - m2_mae_hz
    - m3_max_peak_hz
    - m5_trip_risk_s
    - m13_cpu_time_us
    - m14_struct_latency_ms
    - m22_invalid_output_rate
