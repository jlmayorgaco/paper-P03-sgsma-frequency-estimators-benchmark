[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openfreqbench"
version = "2.0.0"
description = "Open source benchmark platform for single-phase grid frequency estimators."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Juan Lugo", email = "juan.lugo@example.com" }
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "optuna>=4.0",
  "numba>=0.60",
  "tqdm>=4.66",
  "scikit-learn>=1.5",
  "PyYAML>=6.0",
]
keywords = [
  "frequency-estimation",
  "power-systems",
  "pmu",
  "benchmark",
  "monte-carlo",
  "sgsma",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/jlmayorgaco/paper-P03-sgsma-frequency-estimators-benchmark/tree/MVP2.0.0"
Repository = "https://github.com/jlmayorgaco/paper-P03-sgsma-frequency-estimators-benchmark"
Issues = "https://github.com/jlmayorgaco/paper-P03-sgsma-frequency-estimators-benchmark/issues"

[project.scripts]
openfreqbench = "openfreqbench.cli:main"
ofb = "openfreqbench.cli:main"

[project.optional-dependencies]
benchmark-full = ["torch>=2.0"]
andes = ["andes>=1.9"]
opendss = ["opendssdirect.py>=0.9"]
dev = ["pytest>=8.0", "ruff>=0.8", "build>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["analysis*", "estimators*", "openfreqbench*", "pipelines*", "plotting*", "scenarios*"]

[tool.setuptools.package-data]
estimators = ["pi_gru_weights_hybrid.pt"]
openfreqbench = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "artifacts",
  "output",
  "outputs",
  "tests/montecarlo/temp",
]
markers = [
  "canonical: canonical estimator or scenario behavior expected in release gates",
  "legacy: historical Monte Carlo or plotting tests kept for reference",
  "known_numerical_debt: estimator behavior regression kept visible while Phase 1 stabilizes the package",
]

[tool.ruff]
line-length = 100
target-version = "py310"
