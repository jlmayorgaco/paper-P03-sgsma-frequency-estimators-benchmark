name: OpenFreqBench V2

on:
  push:
    paths:
      - "V2/**"
      - ".github/workflows/openfreqbench-v2.yml"
  pull_request:
    paths:
      - "V2/**"
      - ".github/workflows/openfreqbench-v2.yml"

jobs:
  test-v2:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: V2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install V2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Build wheel
        run: python -m build --wheel

      - name: Doctor
        run: openfreqbench doctor

      - name: Quick smoke
        run: openfreqbench quick-test --scenario IEEE_Single_SinWave --estimator ZCD --n-runs 1 --max-workers 1 --id ci-smoke --output-dir artifacts/openfreqbench --no-capture-signals

      - name: Report smoke
        run: openfreqbench report build --input-json artifacts/openfreqbench/ci-smoke/benchmark_report.json

      - name: Quality gate
        run: openfreqbench quality-gate
