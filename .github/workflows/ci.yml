name: CI

on:
  push:
    branches:
      - MVP2.0.0
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider --basetemp artifacts/pytest-tmp

      - name: Run CLI smoke checks
        run: |
          openfreqbench doctor
          openfreqbench run --config configs/quick.yaml --dry-run
          openfreqbench quick-test --scenario IEEE_Single_SinWave --estimator ZCD --n-runs 1 --max-workers 1 --id ci-smoke --output-dir artifacts/openfreqbench --no-capture-signals
          openfreqbench schema --name benchmark-report --validate artifacts/openfreqbench/ci-smoke/benchmark_report.json
          openfreqbench report build --input-json artifacts/openfreqbench/ci-smoke/benchmark_report.json
          openfreqbench quality-gate --skip-tests

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel smoke test
        run: |
          python -m venv .venv-wheel-smoke
          . .venv-wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/openfreqbench-*.whl
          openfreqbench doctor
          openfreqbench run --config configs/quick.yaml --dry-run
