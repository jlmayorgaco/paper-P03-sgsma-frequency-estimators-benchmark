name: Bug report
description: Report a reproducible OpenFreqBench defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command, config, and minimal artifact path if available.
      placeholder: |
        openfreqbench ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste `openfreqbench doctor` output or attach the environment report.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts
      description: Link relevant `benchmark_report.json`, logs, or traceability files.
